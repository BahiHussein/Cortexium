<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortexium Real-Time Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .scrollable-area::-webkit-scrollbar {
            width: 8px;
        }
        .scrollable-area::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .scrollable-area::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        .scrollable-area::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .log-panel {
            height: 150px;
        }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">

    <div class="flex flex-col w-full max-w-2xl h-full max-h-[98vh] bg-white rounded-2xl shadow-2xl">
        <!-- Header -->
        <header class="p-4 border-b bg-slate-50 rounded-t-2xl">
            <h1 class="text-2xl font-bold text-slate-800">Cortexium Chat</h1>
            <p class="text-sm text-slate-500">Your User ID: 
                <span id="user-id" class="font-mono bg-slate-200 text-slate-700 py-1 px-2 rounded-md cursor-pointer" title="Click to copy"></span>
            </p>
        </header>

        <!-- Messages Area -->
        <main id="chat-messages" class="flex-1 p-6 overflow-y-auto space-y-4 scrollable-area">
            <div class="flex justify-center">
                 <div class="bg-slate-200 text-slate-600 text-sm py-1 px-3 rounded-full">Welcome! Open this page in another tab to chat.</div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="p-4 border-t bg-slate-50">
            <div class="flex items-center space-x-4">
                <input type="text" id="message-input" placeholder="Type your message..." class="flex-1 p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                <button id="send-button" class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 active:bg-indigo-800 transition shadow-md">
                    Send
                </button>
            </div>
        </footer>

        <!-- Stress Test Area -->
        <div class="p-4 border-t bg-slate-100">
            <h3 class="text-sm font-semibold text-slate-600 mb-2 text-center">Stress Test (Send 10 Messages)</h3>
            <div class="flex justify-center space-x-2">
                <button id="fast-burst-btn" class="px-4 py-2 text-sm bg-red-500 text-white rounded-lg hover:bg-red-600 transition">Fast Burst (50ms)</button>
                <button id="medium-burst-btn" class="px-4 py-2 text-sm bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition">Medium Burst (250ms)</button>
                <button id="slow-burst-btn" class="px-4 py-2 text-sm bg-green-500 text-white rounded-lg hover:bg-green-600 transition">Slow Burst (1000ms)</button>
            </div>
        </div>

        <!-- Debug Panel -->
        <div class="p-4 border-t bg-slate-200 rounded-b-2xl">
            <h3 class="text-sm font-semibold text-slate-600 mb-2 text-center">Debug Log</h3>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <h4 class="text-xs font-bold text-slate-500">SENT</h4>
                        <button id="copy-sent-btn" class="text-xs text-indigo-600 hover:underline">Copy</button>
                    </div>
                    <div id="sent-log" class="log-panel bg-white p-2 rounded-md overflow-y-auto scrollable-area text-xs font-mono text-slate-700 border"></div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <h4 class="text-xs font-bold text-slate-500">RECEIVED</h4>
                        <button id="copy-received-btn" class="text-xs text-indigo-600 hover:underline">Copy</button>
                    </div>
                    <div id="received-log" class="log-panel bg-white p-2 rounded-md overflow-y-auto scrollable-area text-xs font-mono text-slate-700 border"></div>
                </div>
            </div>
             <div class="text-center mt-2">
                <button id="clear-logs-btn" class="text-xs text-slate-500 hover:underline">Clear Logs</button>
            </div>
        </div>
    </div>
    
    <div id="copy-notification" class="fixed bottom-5 right-5 bg-slate-900 text-white py-2 px-4 rounded-lg shadow-lg opacity-0 transition-opacity duration-300">
        Copied to clipboard!
    </div>


    <script>
        const SERVER_URL = 'http://localhost:3000';
        
        const userIdDisplay = document.getElementById('user-id');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const chatMessages = document.getElementById('chat-messages');
        const copyNotification = document.getElementById('copy-notification');
        const fastBurstBtn = document.getElementById('fast-burst-btn');
        const mediumBurstBtn = document.getElementById('medium-burst-btn');
        const slowBurstBtn = document.getElementById('slow-burst-btn');
        const sentLog = document.getElementById('sent-log');
        const receivedLog = document.getElementById('received-log');
        const copySentBtn = document.getElementById('copy-sent-btn');
        const copyReceivedBtn = document.getElementById('copy-received-btn');
        const clearLogsBtn = document.getElementById('clear-logs-btn');

        let currentUserId = localStorage.getItem('cortexiumChatUserId');
        if (!currentUserId) {
            currentUserId = 'user-' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('cortexiumChatUserId', currentUserId);
        }
        userIdDisplay.textContent = currentUserId;

        // *** NEW: Store a unique ID for this browser tab session ***
        let clientSessionId = sessionStorage.getItem('cortexiumChatSessionId');

        let clientMessageCounter = 0;

        function logDebug(direction, message) {
            const logArea = direction === 'sent' ? sentLog : receivedLog;
            const logEntry = document.createElement('div');
            const time = new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 });
            logEntry.textContent = `[${time}] ID: ${message.clientMessageId} - "${message.text}"`;
            logArea.appendChild(logEntry);
            logArea.scrollTop = logArea.scrollHeight;
        }

        async function postMessageToServer(message) {
             try {
                logDebug('sent', message);
                await fetch(`${SERVER_URL}/message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(message)
                });
            } catch (error) {
                console.error('Failed to send message:', error);
            }
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '') return;

            const message = { 
                senderId: currentUserId, 
                text: text, 
                timestamp: new Date().toISOString(),
                clientMessageId: `${currentUserId}-${clientMessageCounter++}`
            };
            
            appendMessage(message, true);
            messageInput.value = '';
            await postMessageToServer(message);
        }

        function appendMessage(message, isOwnMessage, latency = null) {
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex flex-col ${isOwnMessage ? 'items-end' : 'items-start'}`;
            const messageBubble = document.createElement('div');
            messageBubble.className = `max-w-xs md:max-w-md p-3 rounded-2xl shadow-sm`;
            messageBubble.classList.add(isOwnMessage ? 'bg-indigo-600' : 'bg-slate-200');
            const senderP = document.createElement('p');
            senderP.className = `text-xs font-bold mb-1 ${isOwnMessage ? 'text-indigo-200' : 'text-slate-500'}`;
            senderP.textContent = isOwnMessage ? 'You' : message.senderId;
            const textP = document.createElement('p');
            textP.className = `text-base break-words ${isOwnMessage ? 'text-white' : 'text-slate-800'}`;
            textP.textContent = message.text;
            const debugInfo = document.createElement('div');
            debugInfo.className = `text-xs mt-2 text-right ${isOwnMessage ? 'text-indigo-300' : 'text-slate-400'}`;
            const time = new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            let debugText = `Sent: ${time}`;
            if (latency !== null) {
                debugText += ` | Latency: ${latency}ms`;
            }
            debugInfo.textContent = debugText;
            messageBubble.appendChild(senderP);
            messageBubble.appendChild(textP);
            messageBubble.appendChild(debugInfo);
            messageWrapper.appendChild(messageBubble);
            chatMessages.appendChild(messageWrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function pollForMessages() {
            try {
                const headers = {};
                // *** NEW: Send the session ID so the server knows who we are ***
                if (clientSessionId) {
                    headers['X-Client-Id'] = clientSessionId;
                }

                const response = await fetch(`${SERVER_URL}/events`, { headers });
                
                // *** NEW: Check for and store the session ID from the server ***
                const newSessionId = response.headers.get('X-Client-Id');
                if (newSessionId) {
                    clientSessionId = newSessionId;
                    sessionStorage.setItem('cortexiumChatSessionId', clientSessionId);
                }

                if (response.status === 200) {
                    const receivedTime = Date.now();
                    const message = await response.json();
                    if (message.senderId !== currentUserId) {
                        const sentTime = new Date(message.timestamp).getTime();
                        const latency = receivedTime - sentTime;
                        appendMessage(message, false, latency);
                        logDebug('received', message);
                    }
                }
            } catch (error) {
                console.error('Long polling error:', error);
                await new Promise(resolve => setTimeout(resolve, 2000));
            } finally {
                if (!document.hidden) {
                    pollForMessages();
                }
            }
        }
        
        async function sendBurst(count, intervalMs, name) {
            for (let i = 1; i <= count; i++) {
                const message = {
                    senderId: currentUserId,
                    text: `${name} Burst Message #${i}`,
                    timestamp: new Date().toISOString(),
                    clientMessageId: `${currentUserId}-${clientMessageCounter++}`
                };
                appendMessage(message, true);
                await postMessageToServer(message);
                if (i < count) {
                    await new Promise(resolve => setTimeout(resolve, intervalMs));
                }
            }
        }

        function copyLogToClipboard(logArea) {
            const logText = Array.from(logArea.children)
                                 .map(el => el.textContent)
                                 .join('\n');
            navigator.clipboard.writeText(logText).then(() => {
                copyNotification.textContent = 'Log copied to clipboard!';
                copyNotification.classList.remove('opacity-0');
                setTimeout(() => copyNotification.classList.add('opacity-0'), 2000);
            });
        }

        // --- Event Listeners ---
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });
        fastBurstBtn.addEventListener('click', () => sendBurst(10, 50, 'Fast'));
        mediumBurstBtn.addEventListener('click', () => sendBurst(10, 250, 'Medium'));
        slowBurstBtn.addEventListener('click', () => sendBurst(10, 1000, 'Slow'));
        
        userIdDisplay.addEventListener('click', () => {
            navigator.clipboard.writeText(currentUserId).then(() => {
                copyNotification.textContent = 'User ID copied to clipboard!';
                copyNotification.classList.remove('opacity-0');
                setTimeout(() => copyNotification.classList.add('opacity-0'), 2000);
            });
        });

        copySentBtn.addEventListener('click', () => copyLogToClipboard(sentLog));
        copyReceivedBtn.addEventListener('click', () => copyLogToClipboard(receivedLog));
        clearLogsBtn.addEventListener('click', () => {
            sentLog.innerHTML = '';
            receivedLog.innerHTML = '';
        });

        // --- Initial Call ---
        pollForMessages();
    </script>
</body>
</html>
